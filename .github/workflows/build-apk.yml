name: Build Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Clean Project & Merge Code
        run: |
          # Create a fresh flutter app structure
          flutter create --org com.kruger.vpn vpn_app
          
          # Copy user's code into the clean project structure
          if [ -d "lib" ]; then cp -rf lib/ vpn_app/; fi
          if [ -f "pubspec.yaml" ]; then cp -f pubspec.yaml vpn_app/; fi
          
          cd vpn_app
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kruger-VPN-APK
          path: vpn_app/build/app/outputs/flutter-apk/app-release.apk
          
